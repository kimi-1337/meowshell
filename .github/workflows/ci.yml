name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run dist:ci:x64
      - name: Smoke-test packaged renderer
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*-x64-portable.zip | Select-Object -First 1
          if (-not $archive) { throw "x64 ZIP was not produced" }
          Expand-Archive $archive.FullName -DestinationPath dist/smoke
          $exe = Get-ChildItem dist/smoke/MeowShell.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MeowShell.exe is missing from ZIP" }
          $profile = Join-Path $env:RUNNER_TEMP "meowshell-smoke-profile"
          $process = Start-Process $exe.FullName -ArgumentList "--meowshell-ci-smoke", "--user-data-dir=$profile" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meowshell-windows-x64-smoke
          path: dist/*-x64-portable.zip
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "MeowShell $GITHUB_REF_NAME (Beta)" --notes "Unsigned beta build. Verify SHA256SUMS.txt before running. No telemetry or automatic crash upload."
          fi

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run ensure:win-pty
      - name: Build ZIP and NSIS installer
        shell: pwsh
        run: npx electron-builder --win zip nsis --${{ matrix.arch }} --publish never
      - name: Create architecture checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip,dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          }
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: github.event.repository.private == false
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
      - name: Upload architecture files to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem dist/*.zip,dist/*.exe
            Get-Item "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          )
          if ($files.Count -lt 3) { throw "Release files are missing" }
          $arguments = @("release", "upload", $env:GITHUB_REF_NAME) + $files.FullName + @("--repo", $env:GITHUB_REPOSITORY, "--clobber")
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Could not upload architecture files" }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --pattern "*.exe" --pattern "SHA256SUMS-*.txt" --dir artifacts
          cat artifacts/SHA256SUMS-*.txt | sort > artifacts/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          zip -0 -j "artifacts/MeowShell-${version}-release-bundle.zip" artifacts/*.zip artifacts/*.exe artifacts/SHA256SUMS.txt LICENSE README.md README.ru.md
          gh release upload "$GITHUB_REF_NAME" artifacts/SHA256SUMS.txt "artifacts/MeowShell-${version}-release-bundle.zip" --repo "$GITHUB_REPOSITORY" --clobber
          gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS-x64.txt --repo "$GITHUB_REPOSITORY" --yes
          gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS-arm64.txt --repo "$GITHUB_REPOSITORY" --yes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          }
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --prerelease \
              --title "MeowShell $GITHUB_REF_NAME (Beta)" \
              --notes "Beta build. Verify SHA256SUMS.txt before running. No telemetry or automatic crash upload." \
              --generate-notes
          fi

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run ensure:win-pty
      - name: Build ZIP and NSIS installer
        shell: pwsh
        env:
          # Optional trusted code-signing certificate. When these repository
          # secrets are configured, electron-builder signs the app and setup.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win zip nsis --${{ matrix.arch }} --publish never
      - name: Verify Authenticode signature when configured
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ($env:SIGNING_CONFIGURED) {
            Get-ChildItem dist/*-setup.exe | ForEach-Object {
              $signature = Get-AuthenticodeSignature $_.FullName
              if ($signature.Status -ne "Valid") {
                throw "Invalid Authenticode signature on $($_.Name): $($signature.Status)"
              }
            }
          } else {
            Write-Host "WINDOWS_CSC_LINK is not configured; build remains unsigned and SmartScreen may warn."
          }
      - name: Preserve architecture update manifest
        shell: pwsh
        run: Copy-Item dist/latest.yml "dist/latest-${{ matrix.arch }}.yml"
      - name: Smoke-test packaged x64 application
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*-x64-portable.zip | Select-Object -First 1
          if (-not $archive) { throw "x64 ZIP was not produced" }
          Expand-Archive $archive.FullName -DestinationPath dist/smoke
          $exe = Get-ChildItem dist/smoke/MeowShell.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MeowShell.exe is missing from ZIP" }
          $profile = Join-Path $env:RUNNER_TEMP "meowshell-release-smoke-profile"
          $process = Start-Process $exe.FullName -ArgumentList "--meowshell-ci-smoke", "--user-data-dir=$profile" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          $leftovers = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profile) })
          if ($leftovers.Count -gt 0) {
            $leftovers | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            throw "MeowShell left $($leftovers.Count) process(es) behind after window close"
          }
      - name: Create architecture checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip,dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          }
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: github.event.repository.private == false
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
      - name: Upload architecture files to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem dist/*.zip,dist/*.exe,dist/*.blockmap
            Get-Item "dist/latest-${{ matrix.arch }}.yml"
            Get-Item "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          )
          if ($files.Count -lt 5) { throw "Release files are missing" }
          $arguments = @("release", "upload", $env:GITHUB_REF_NAME) + $files.FullName + @("--repo", $env:GITHUB_REPOSITORY, "--clobber")
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Could not upload architecture files" }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "MeowShell-*-win-*-portable.zip" --pattern "MeowShell-*-win-*-setup.exe" --pattern "*.blockmap" --pattern "latest-*.yml" --pattern "SHA256SUMS-*.txt" --dir artifacts
          node scripts/merge-update-manifests.js artifacts/latest-x64.yml artifacts/latest-arm64.yml artifacts/latest.yml
          cat artifacts/SHA256SUMS-*.txt | sort > artifacts/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          bundle="artifacts/MeowShell-${version}-release-bundle.zip"
          zip -0 -j "$bundle" artifacts/MeowShell-*-win-*-portable.zip artifacts/MeowShell-*-win-*-setup.exe artifacts/SHA256SUMS.txt LICENSE README.md README.ru.md
          (
            cd artifacts
            sha256sum "MeowShell-${version}-release-bundle.zip"
          ) >> artifacts/SHA256SUMS.txt
          manifests=(artifacts/latest.yml)
          channel="$(node -p "require('./scripts/merge-update-manifests').prereleaseChannel(require('./package.json').version)")"
          if test "$channel" != "latest"; then manifests+=("artifacts/${channel}.yml"); fi
          gh release upload "$GITHUB_REF_NAME" artifacts/SHA256SUMS.txt "artifacts/MeowShell-${version}-release-bundle.zip" "${manifests[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS-x64.txt --repo "$GITHUB_REPOSITORY" --yes
          gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS-arm64.txt --repo "$GITHUB_REPOSITORY" --yes
          gh release delete-asset "$GITHUB_REF_NAME" latest-x64.yml --repo "$GITHUB_REPOSITORY" --yes
          gh release delete-asset "$GITHUB_REF_NAME" latest-arm64.yml --repo "$GITHUB_REPOSITORY" --yes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run ensure:win-pty
      - name: Build ZIP and NSIS installer
        shell: pwsh
        run: npx electron-builder --win zip nsis --${{ matrix.arch }} --publish never
      - name: Create architecture checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip,dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat artifacts/SHA256SUMS-*.txt | sort > artifacts/SHA256SUMS.txt
          rm artifacts/SHA256SUMS-x64.txt artifacts/SHA256SUMS-arm64.txt
          version="${GITHUB_REF_NAME#v}"
          zip -0 -j "artifacts/MeowShell-${version}-release-bundle.zip" artifacts/*.zip artifacts/*.exe artifacts/SHA256SUMS.txt LICENSE README.md README.ru.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --title "MeowShell $GITHUB_REF_NAME (Beta)" --notes "Unsigned beta build. Verify SHA256SUMS.txt before running. No telemetry or automatic crash upload."
          fi
